name: CI

on:
  push:
    branches: [main, claude-forge]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Root tooling (client type-check reads the root vite config)
        run: npm ci --ignore-scripts
      - name: Server build
        run: |
          cd server
          npm ci
          npm run build
      - name: Client build
        run: |
          cd client
          npm ci
          npm run build
